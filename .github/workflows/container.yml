name: Build and publish Codespaces image

on:
  push:
    branches: [main]
    paths:
      - '.devcontainer/**'
      - '.github/workflows/container.yml'
      - 'flake.nix'
      - 'flake.lock'
      - 'tests/*.sh'
  pull_request:
    paths:
      - '.devcontainer/**'
      - '.github/workflows/container.yml'
      - 'flake.nix'
      - 'flake.lock'
      - 'tests/*.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codespaces-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tools:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix flake check

  image:
    strategy:
      matrix:
        profile: [default, personnel]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          load: true
          pull: true
          platforms: linux/amd64
          build-args: MPI_PROFILE=${{ matrix.profile }}
          tags: mpi-environnement:${{ matrix.profile }}
          cache-from: type=gha,scope=mpi-${{ matrix.profile }}
          cache-to: type=gha,scope=mpi-${{ matrix.profile }},mode=max
      - name: Test teaching tools and the writable OPAM switch
        run: |
          docker run --rm -i mpi-environnement:${{ matrix.profile }} sh -s < .devcontainer/smoke-test.sh
          if [ '${{ matrix.profile }}' = personnel ]; then
            docker run --rm -i mpi-environnement:personnel bash -s < tests/personnel-smoke.sh
          fi
          docker image inspect mpi-environnement:${{ matrix.profile }} --format 'Image size: {{.Size}} bytes'
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          PROFILE: ${{ matrix.profile }}
        run: |
          IMAGE="${IMAGE,,}"
          if [ "$PROFILE" = default ]; then
            TAG=latest
            SHA_TAG="sha-$GITHUB_SHA"
          else
            TAG=personnel
            SHA_TAG="personnel-sha-$GITHUB_SHA"
          fi
          docker tag "mpi-environnement:$PROFILE" "$IMAGE:$TAG"
          docker tag "mpi-environnement:$PROFILE" "$IMAGE:$SHA_TAG"
          docker push "$IMAGE:$SHA_TAG"
          docker push "$IMAGE:$TAG"
