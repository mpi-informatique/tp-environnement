name: Build and publish Codespaces image

on:
  push:
    branches: [main]
    paths:
      - '.devcontainer/**'
      - '.github/workflows/container.yml'
      - 'flake.nix'
      - 'flake.lock'
      - 'tests/**'
  pull_request:
    paths:
      - '.devcontainer/**'
      - '.github/workflows/container.yml'
      - 'flake.nix'
      - 'flake.lock'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codespaces-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tools:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix flake check

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          load: true
          pull: true
          platforms: linux/amd64
          tags: mpi-environnement:test
          cache-from: type=gha,scope=mpi-default
          cache-to: type=gha,scope=mpi-default,mode=max
      - name: Test teaching tools and the writable OPAM switch
        run: |
          docker run --rm -i mpi-environnement:test sh -s < .devcontainer/smoke-test.sh
          docker image inspect mpi-environnement:test --format 'Image size: {{.Size}} bytes'
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          IMAGE="${IMAGE,,}"
          TAG=latest
          SHA_TAG="sha-$GITHUB_SHA"
          docker tag "mpi-environnement:test" "$IMAGE:$TAG"
          docker tag "mpi-environnement:test" "$IMAGE:$SHA_TAG"
          docker push "$IMAGE:$SHA_TAG"
          docker push "$IMAGE:$TAG"
